name: Build and deploy AquaNexus

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.22
          actions-cache-folder: emsdk-cache

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglm-dev ninja-build
          mkdir -p local_glm
          cp -r /usr/include/glm local_glm/

      - name: Build optimized WebAssembly release
        run: |
          chmod +x web/build_web.sh
          ./web/build_web.sh -DGLM_INCLUDE_DIR=$PWD/local_glm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
