<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#061318">
  <title>AquaNexus Simulation</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #c7d6cd;
    }

    #canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      outline: 0;
      background: #c7d6cd;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      gap: 14px;
      color: #c8fff0;
      background: #061318;
      font: 600 14px/1.4 system-ui, sans-serif;
      letter-spacing: .08em;
      text-align: center;
      transition: opacity .25s ease;
    }

    #loader::before {
      width: 42px;
      height: 42px;
      margin: auto;
      content: "";
      border: 3px solid rgba(74, 255, 205, .18);
      border-top-color: #4affcd;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    body.ready #loader {
      opacity: 0;
      pointer-events: none;
    }

    body.failed #loader {
      color: #ffb4b4;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <span id="status">LOADING AQUANEXUS SIMULATION</span>
  </div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    const statusNode = document.getElementById("status");
    const canvasNode = document.getElementById("canvas");

    window.AquaNexusSetEnvironment = (night) => {
      const background = night ? "#061318" : "#c7d6cd";
      document.documentElement.style.background = background;
      document.body.style.background = background;
      canvasNode.style.background = background;
    };
    window.AquaNexusSetEnvironment(false);

    const markReady = () => document.body.classList.add("ready");
    const markFailed = (message) => {
      document.body.classList.add("failed");
      statusNode.textContent = "SIMULATION COULD NOT START: " + message;
    };

    var Module = {
      canvas: canvasNode,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: (message) => {
        if (message) statusNode.textContent = message.toUpperCase();
        else markReady();
      },
      monitorRunDependencies: (remaining) => {
        if (remaining > 0) statusNode.textContent = "LOADING SIMULATION DATA (" + remaining + ")";
      },
      postRun: [markReady],
      onAbort: (reason) => markFailed(String(reason || "unknown error"))
    };

    window.addEventListener("error", (event) => {
      if (!document.body.classList.contains("ready")) markFailed(event.message || "browser error");
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
